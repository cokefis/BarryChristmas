name: crack

on:
  workflow_dispatch:
    inputs:
      release_version_tag:
        description: '要构建的 Sandboxie release 版本号（例如 v1.18.2）'
        required: true
        default: 'v1.18.2'
        type: string

      verify_file_url:
        description: 'verify.c 文件链接'
        required: true
        default: 'https://raw.githubusercontent.com/cokefis/BarryChristmas/master/verify.c'
        type: string

env:
  forbuildVariables: use Installer\buildVariables.cmd file
  DEFAULT_VERIFY_FILE_URL: 'https://raw.githubusercontent.com/cokefis/BarryChristmas/master/verify.c'


jobs:

  # ============================================================
  # 更新 verify.c
  # ============================================================

  Update_verify:
    name: Update verify.c
    runs-on: windows-2022

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # Checkout 当前项目仓库
      # ----------------------------------------------------------

      - name: Checkout current project
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # 如果输入 URL 与默认值不同，则下载 verify.c
      # ----------------------------------------------------------

      - name: Download verify.c
        if: ${{ inputs.verify_file_url != env.DEFAULT_VERIFY_FILE_URL }}
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "${{ inputs.verify_file_url }}" `
            -OutFile ".\verify.c"

          if (!(Test-Path ".\verify.c")) {
              throw "verify.c download failed."
          }

      # ----------------------------------------------------------
      # 如果 verify.c 有变化，则提交到当前项目仓库
      # ----------------------------------------------------------

      - name: Commit verify.c
        if: ${{ inputs.verify_file_url != env.DEFAULT_VERIFY_FILE_URL }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add verify.c

          if (git diff --cached --quiet) {
              Write-Host "verify.c has not changed. Nothing to commit."
          }
          else {
              git commit -m "Update verify.c for ${{ inputs.release_version_tag }}"
              git push origin "HEAD:${env:GITHUB_REF_NAME}"
          }

      # ----------------------------------------------------------
      # 无论是否下载，都检查项目根目录 verify.c
      # ----------------------------------------------------------

      - name: Check verify.c
        shell: powershell
        run: |
          if (!(Test-Path ".\verify.c")) {
              throw "verify.c not found in project root."
          }

          Write-Host "Using verify.c:"
          Get-Item ".\verify.c" | Format-List FullName,Length,LastWriteTime

      # ----------------------------------------------------------
      # 上传最终使用的 verify.c
      # ----------------------------------------------------------

      - name: Upload verify.c
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verify-c
          path: verify.c
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # Build x64 Qt6
  # ============================================================

  Build_x64_Qt6:
    runs-on: windows-2022
    timeout-minutes: 45

    needs:
      - Update_verify

    permissions:
      contents: read
      actions: read

    steps:

      # ----------------------------------------------------------
      # Checkout Sandboxie 到 Sandboxie 子目录
      # ----------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: sandboxie-plus/Sandboxie
          ref: ${{ inputs.release_version_tag }}
          path: Sandboxie

      # ----------------------------------------------------------
      # 获取 verify.c
      # ----------------------------------------------------------

      - name: Download verify.c
        uses: actions/download-artifact@v8
        with:
          name: verify-c
          path: .

      # ----------------------------------------------------------
      # 替换 Sandboxie 内的 verify.c
      #
      # 当前 working-directory = Sandboxie
      #
      # 所以：
      # ..\verify.c
      # ->
      # Sandboxie\core\drv\verify.c
      # ----------------------------------------------------------

      - name: Replace verify.c
        working-directory: Sandboxie
        shell: powershell
        run: |
          if (!(Test-Path "..\verify.c")) {
              throw "verify.c not found."
          }

          Copy-Item `
            -Path "..\verify.c" `
            -Destination "Sandboxie\core\drv\verify.c" `
            -Force

      # ----------------------------------------------------------
      # Load Variables
      # ----------------------------------------------------------

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Sandboxie\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%
          echo qt_version=%qt6_version% >> %GITHUB_ENV%

      # ----------------------------------------------------------
      # Setup msbuild
      # ----------------------------------------------------------

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      # ==========================================================
      # Compile Sandboxie Core
      # ==========================================================

      - name: Build Sandboxie x86 (DLLs & svc)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64 (all)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 (drv)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      - name: Install Qt6 x64
        working-directory: Sandboxie
        run: SandboxiePlus\install_qt.cmd x64

      # ==========================================================
      # Jom
      # ==========================================================

      - name: Cache jom archive
        id: cache-jom
        uses: actions/cache@v6.1.0
        with:
          path: Sandboxie/jom_1_1_4.zip
          key: jom-1.1.4-${{ runner.os }}
          restore-keys: |
            jom-1.1.4-
            jom-
          fail-on-cache-miss: false

      - name: Installing Jom
        shell: cmd
        working-directory: Sandboxie
        run: SandboxiePlus\install_jom.cmd

      # ==========================================================
      # Compile Sandboxie Plus
      # ==========================================================

      - name: Build Sandboxie-Plus x64
        working-directory: Sandboxie
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Build SbieShell x64
        working-directory: Sandboxie
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration="Release" /p:Platform=x64

      # ==========================================================
      # Compile Sandboxie Tools
      # ==========================================================

      - name: Build Sandboxie-Tools x64
        working-directory: Sandboxie
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration="Release" /p:Platform=x64 -maxcpucount:8

      # ==========================================================
      # Merge everything together
      # ==========================================================

      - name: Add missing languages for Qt6 (issue 1528)
        working-directory: Sandboxie
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get openssl binaries
        working-directory: Sandboxie
        run: Installer\get_openssl.cmd

      - name: Get 7z binaries
        working-directory: Sandboxie
        run: Installer\get_7zip.cmd

      - name: Merging Build
        working-directory: Sandboxie
        run: Installer\copy_build.cmd x64 build_qt6

      - name: Collect installer assets
        working-directory: Sandboxie
        run: Installer\get_assets.cmd

      # ==========================================================
      # Upload x64
      # ==========================================================

      - name: Upload Sandboxie x64
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie_x64
          path: Sandboxie/Installer/SbiePlus_x64/SbieDrv.sys
          retention-days: 60
          if-no-files-found: error


  # ============================================================
  # Build ARM64 Qt6
  # ============================================================

  Build_ARM64_Qt6:
    runs-on: windows-2022
    timeout-minutes: 45

    needs:
      - Update_verify

    permissions:
      contents: read
      actions: read

    steps:

      # ----------------------------------------------------------
      # Checkout Sandboxie
      # ----------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: sandboxie-plus/Sandboxie
          ref: ${{ inputs.release_version_tag }}
          path: Sandboxie

      # ----------------------------------------------------------
      # 获取 verify.c
      # ----------------------------------------------------------

      - name: Download verify.c
        uses: actions/download-artifact@v8
        with:
          name: verify-c
          path: .

      # ----------------------------------------------------------
      # 替换 Sandboxie 内的 verify.c
      # ----------------------------------------------------------

      - name: Replace verify.c
        working-directory: Sandboxie
        shell: powershell
        run: |
          if (!(Test-Path "..\verify.c")) {
              throw "verify.c not found."
          }

          Copy-Item `
            -Path "..\verify.c" `
            -Destination "Sandboxie\core\drv\verify.c" `
            -Force

      # ----------------------------------------------------------
      # Load Variables
      # ----------------------------------------------------------

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Sandboxie\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      # ==========================================================
      # Compile Sandboxie Core
      # ==========================================================

      - name: Build Sandboxie x86 (DLLs & svc)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie ARM64 (all)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=ARM64 -maxcpucount:8

      - name: Build Sandboxie ARM64EC (DLL)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=ARM64EC -maxcpucount:8

      - name: Build Sandboxie ARM64 (drv)
        working-directory: Sandboxie
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=ARM64 -maxcpucount:8

      # ==========================================================
      # Prepare Qt Framework for ARM64
      #
      # 保持你最初能工作的配置，不修改 arch
      # ==========================================================

      - name: Install Qt6 x64
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '${{ env.qt6_version }}'
          arch: 'win64_msvc2022_64'
          tools: 'tools_opensslv3_x64'
          cache: true

      - name: Install Qt6 ARM64
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '${{ env.qt6_version }}'
          arch: 'win64_msvc2022_arm64_cross_compiled'
          tools: 'tools_opensslv3_x64'
          cache: true

      # ==========================================================
      # Jom
      # ==========================================================

      - name: Cache jom archive
        id: cache-jom
        uses: actions/cache@v6.1.0
        with:
          path: Sandboxie/jom_1_1_4.zip
          key: jom-1.1.4-${{ runner.os }}
          restore-keys: |
            jom-1.1.4-
            jom-
          fail-on-cache-miss: false

      - name: Installing Jom
        shell: cmd
        working-directory: Sandboxie
        run: SandboxiePlus\install_jom.cmd

      # ==========================================================
      # Compile Sandboxie Plus
      # ==========================================================

      - name: Build Sandboxie-Plus ARM64
        working-directory: Sandboxie
        run: SandboxiePlus\qmake_plus.cmd ARM64 build_qt6

      - name: Build SbieShell ARM64
        working-directory: Sandboxie
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration="Release" /p:Platform=ARM64

      # ==========================================================
      # Compile Sandboxie Tools
      # ==========================================================

      - name: Build Sandboxie-Tools ARM64
        working-directory: Sandboxie
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration="Release" /p:Platform=ARM64 -maxcpucount:8

      # ==========================================================
      # Merge everything together
      # ==========================================================

      - name: Add missing languages for Qt6
        working-directory: Sandboxie
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get openssl binaries
        working-directory: Sandboxie
        run: Installer\get_openssl.cmd

      - name: Get 7z binaries
        working-directory: Sandboxie
        run: Installer\get_7zip.cmd

      - name: Merging Build
        working-directory: Sandboxie
        run: Installer\copy_build.cmd ARM64 build_qt6

      # ==========================================================
      # Upload ARM64
      # ==========================================================

      - name: Upload Sandboxie ARM64
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie_ARM64
          path: Sandboxie/Installer/SbiePlus_a64/SbieDrv.sys
          retention-days: 60
          if-no-files-found: error


  # ============================================================
  # Release
  # ============================================================

  Release:
    name: Create Release

    needs:
      - Update_verify
      - Build_x64_Qt6
      - Build_ARM64_Qt6

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:

      # ----------------------------------------------------------
      # Checkout 当前项目
      #
      # 使用 Update_verify 最终的 commit
      # ----------------------------------------------------------

      - name: Checkout current project
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.Update_verify.outputs.commit_sha }}

      # ----------------------------------------------------------
      # 下载 x64
      # ----------------------------------------------------------

      - name: Download Sandboxie x64
        uses: actions/download-artifact@v8
        with:
          name: Sandboxie_x64
          path: release/x64

      # ----------------------------------------------------------
      # 下载 ARM64
      # ----------------------------------------------------------

      - name: Download Sandboxie ARM64
        uses: actions/download-artifact@v8
        with:
          name: Sandboxie_ARM64
          path: release/ARM64

      # ----------------------------------------------------------
      # 检查文件
      # ----------------------------------------------------------

      - name: Check release files
        shell: bash
        run: |
          set -e

          test -f release/x64/SbieDrv.sys
          test -f release/ARM64/SbieDrv.sys

          echo "x64:"
          ls -lh release/x64/SbieDrv.sys

          echo
          echo "ARM64:"
          ls -lh release/ARM64/SbieDrv.sys

      # ----------------------------------------------------------
      # 重命名两个文件
      # ----------------------------------------------------------

      - name: Prepare release files
        shell: bash
        run: |
          mv \
            release/x64/SbieDrv.sys \
            release/SbieDrv_x64.sys

          mv \
            release/ARM64/SbieDrv.sys \
            release/SbieDrv_ARM64.sys

          echo
          echo "Release files:"
          ls -lh release/

      # ----------------------------------------------------------
      # 创建 Release
      # ----------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ inputs.release_version_tag }}" \
            release/SbieDrv_x64.sys \
            release/SbieDrv_ARM64.sys \
            --title "${{ inputs.release_version_tag }}" \
            --notes "Automated build for Sandboxie ${{ inputs.release_version_tag }}"